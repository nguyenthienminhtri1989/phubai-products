name: Deploy ERP to SPB Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # IMPORTANT: Stop PM2 + start maintenance BEFORE checkout.
      # Reason: actions/checkout runs `git clean -ffdx` (removes node_modules) and
      # may recreate the workspace. If the Next.js app is still running it locks
      # node_modules\.prisma\client\query_engine-windows.dll.node, so checkout fails
      # with EPERM "operation not permitted, unlink". Release the lock first.
      # NOTE: keep this run block ASCII-only. Windows PowerShell 5.1 on the runner
      # reads the temp .ps1 as ANSI; non-ASCII chars (Vietnamese diacritics, em dash)
      # get mangled and break string parsing.
      - name: 1. Stop PM2 and start maintenance server (before checkout)
        shell: powershell
        run: |
          # Workspace may not exist on the very first run - use the fixed runner path.
          $workdir = "$env:GITHUB_WORKSPACE"

          # 1.1 Stop PM2 app phubai-erp to free port 3001 and file locks
          $pm2 = "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd"
          if (Test-Path $pm2) { & $pm2 stop phubai-erp 2>$null }

          # 1.2 Kill any process still holding port 3001
          $conn = Get-NetTCPConnection -LocalPort 3001 -ErrorAction SilentlyContinue
          if ($conn) {
            Stop-Process -Id $conn.OwningProcess -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2

          # 1.3 Start maintenance server (if script is still on disk from a prior deploy).
          # The node process loads the script into RAM so it keeps serving even if
          # checkout later deletes the file. Cloudflare Tunnel routes to 3001 so users
          # see the maintenance page instead of a 502/523 error.
          $msScript = Join-Path $workdir "scripts\maintenance-server.js"
          if (Test-Path $msScript) {
            New-Item -Path (Join-Path $workdir "maintenance.flag") -ItemType File -Force | Out-Null
            $proc = Start-Process `
              -FilePath "node" `
              -ArgumentList $msScript `
              -WorkingDirectory $workdir `
              -PassThru `
              -WindowStyle Hidden `
              -RedirectStandardOutput (Join-Path $workdir "maintenance-server.log") `
              -RedirectStandardError (Join-Path $workdir "maintenance-server.err.log")
            $proc.Id | Out-File (Join-Path $workdir "maintenance-server.pid") -Encoding ASCII
            Write-Host ">> Maintenance server started, PID = $($proc.Id)"
            Start-Sleep -Seconds 3
            $check = Get-NetTCPConnection -LocalPort 3001 -State Listen -ErrorAction SilentlyContinue
            if ($check) { Write-Host ">> Maintenance server listening on port 3001" }
            else { Write-Warning "Maintenance server not listening - see maintenance-server.err.log" }
          } else {
            Write-Host ">> No scripts\maintenance-server.js yet (first deploy) - skipping maintenance."
          }

      - name: 2. Checkout code
        uses: actions/checkout@v4

      - name: 3. Create .env file from Secrets
        shell: powershell
        env:
          ENV_DATA: ${{ secrets.ENV_FILE }}
        run: |
          [System.IO.File]::WriteAllText("$(Get-Location)\.env", $env:ENV_DATA)

      - name: 4. Install dependencies
        run: npm install

      - name: 5. Apply Database Changes Safely
        run: npx prisma migrate deploy

      - name: 6. Prisma Generate
        run: npx prisma generate

      - name: 7. Build Next.js
        run: npm run build

      - name: 8. Stop maintenance server and restart PM2
        shell: powershell
        run: |
          $workdir = Get-Location

          # 8.1 Stop maintenance server to free port 3001
          if (Test-Path "$workdir\maintenance-server.pid") {
            $msPid = Get-Content "$workdir\maintenance-server.pid"
            if ($msPid) {
              Stop-Process -Id $msPid -Force -ErrorAction SilentlyContinue
              Write-Host ">> Stopped maintenance server (PID $msPid)"
            }
            Remove-Item "$workdir\maintenance-server.pid" -Force -ErrorAction SilentlyContinue
          }

          # 8.2 In case some node process still clings to 3001
          $conn = Get-NetTCPConnection -LocalPort 3001 -ErrorAction SilentlyContinue
          if ($conn) { Stop-Process -Id $conn.OwningProcess -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 1

          # 8.3 Restart PM2 (the real Next.js app)
          & "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd" startOrReload ecosystem.config.js --only phubai-erp --update-env

          # 8.4 Wait for the app to come back up
          $maxWait = 30
          for ($i = 0; $i -lt $maxWait; $i++) {
            $up = Get-NetTCPConnection -LocalPort 3001 -State Listen -ErrorAction SilentlyContinue
            if ($up) { Write-Host ">> Next.js listening on 3001"; break }
            Start-Sleep -Seconds 1
          }

      - name: 9. Disable maintenance mode (remove flag)
        shell: powershell
        run: |
          $flagPath = "$(Get-Location)\maintenance.flag"
          if (Test-Path $flagPath) {
            Remove-Item -Path $flagPath -Force
            Write-Host ">> Maintenance mode OFF. Users can access normally."
          }

      # Fallback: if any step fails, make sure users are not stuck on the maintenance page
      - name: 10. (Fallback) Cleanup on failed deploy
        if: failure()
        shell: powershell
        run: |
          $workdir = Get-Location
          Write-Host "!!! DEPLOY FAILED - cleaning up..."

          # Stop maintenance server if still running
          if (Test-Path "$workdir\maintenance-server.pid") {
            $msPid = Get-Content "$workdir\maintenance-server.pid"
            if ($msPid) { Stop-Process -Id $msPid -Force -ErrorAction SilentlyContinue }
            Remove-Item "$workdir\maintenance-server.pid" -Force -ErrorAction SilentlyContinue
          }

          # Free port 3001
          $conn = Get-NetTCPConnection -LocalPort 3001 -ErrorAction SilentlyContinue
          if ($conn) { Stop-Process -Id $conn.OwningProcess -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 1

          # Try to restart the old app so users can still use it
          & "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd" startOrReload ecosystem.config.js --only phubai-erp --update-env

          # Remove flag so the app is not stuck on /maintenance when it comes back
          $flagPath = "$workdir\maintenance.flag"
          if (Test-Path $flagPath) {
            Remove-Item -Path $flagPath -Force
            Write-Host ">> Removed maintenance.flag so users are not stuck"
          }
